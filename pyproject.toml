[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "tubeless"
version         = "0.5.0"
description     = "Summarize YouTube videos with an LLM, one video or a daily digest."
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
authors         = [{ name = "seokhoonj", email = "seokhoonj@gmail.com" }]
keywords        = ["youtube", "transcript", "summarize", "llm", "digest", "openai", "claude"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
# 3.11+ for the stdlib tomllib the digest's channels.toml parser uses.
requires-python = ">=3.11"
dependencies    = [
    "youtube-transcript-api>=1.0",
    "openai>=1.0",
    "requests>=2.31",
]

[project.urls]
Homepage   = "https://github.com/seokhoonj/tubeless"
Repository = "https://github.com/seokhoonj/tubeless"
Issues     = "https://github.com/seokhoonj/tubeless/issues"

[project.optional-dependencies]
# The Claude backend's SDK (the `anthropic` package) is imported lazily, so it is
# optional -- an OpenAI/Gemini/Ollama user need not install it. The extra is named
# for the backend (`tubeless[claude]`), the package it pulls in is `anthropic`.
claude = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "anthropic>=0.40",
]

[project.scripts]
tubeless = "tubeless.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tubeless"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
