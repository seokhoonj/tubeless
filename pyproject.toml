[build-system]
# Cap <1.32: hatchling 1.32 emits Metadata-Version 2.5, which the twine bundled in the pinned
# PyPI-publish action rejects (pypa/twine#1327). 2.4 is accepted by PyPI and that twine; the
# 1.27 floor is PEP 639 (the SPDX license expression and license-files). Lift once twine updates.
requires      = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name            = "tubeless"
version         = "0.7.1"
description     = "Summarize YouTube videos with an LLM, one video or a daily digest."
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
authors         = [{ name = "seokhoonj", email = "seokhoonj@gmail.com" }]
keywords        = ["youtube", "transcript", "summarize", "llm", "digest", "openai", "claude"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
# 3.11+ for the stdlib tomllib the digest's channels.toml parser uses.
requires-python = ">=3.11"
dependencies    = [
    "credbox>=0.4",
    "youtube-transcript-api>=1.0",
    "thinchat>=0.1",
    "requests>=2.31",
]

[project.urls]
Homepage   = "https://github.com/seokhoonj/tubeless"
Repository = "https://github.com/seokhoonj/tubeless"
Issues     = "https://github.com/seokhoonj/tubeless/issues"

[project.optional-dependencies]
# yt-dlp (audio download) and faster-whisper (local speech-to-text) power the
# transcript fallback for videos with no captions. Both are imported lazily in
# transcribe.py, so only a user who enables the fallback (TUBELESS_WHISPER_MODEL)
# needs them; the base install carries neither.
whisper = ["yt-dlp>=2025.1", "faster-whisper>=1.0"]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
tubeless = "tubeless.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tubeless"]

[tool.mypy]
python_version = "3.11"
files          = ["src"]
strict         = true

# yt-dlp and faster-whisper are optional (the whisper transcript fallback, imported
# lazily in transcribe.py); they need not be installed to type-check this package.
[[tool.mypy.overrides]]
module                = ["yt_dlp", "faster_whisper"]
ignore_missing_imports = true

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Keep an aliased import on the same statement as its unaliased siblings, so the
# vendor youtube-transcript-api import stays a single block.
combine-as-imports = true
