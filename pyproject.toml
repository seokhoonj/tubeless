[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "tubeless"
version         = "0.1.0"
description     = "Summarize YouTube videos with an LLM, one video or a daily digest."
readme          = "README.md"
# 3.11+ for the stdlib tomllib the digest's channels.toml parser uses.
requires-python = ">=3.11"
dependencies    = [
    "youtube-transcript-api>=1.0",
    "openai>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Claude is the second backend; its SDK is imported lazily, so it is optional --
# an OpenAI-only user need not install it (pip install tubeless[anthropic]).
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "anthropic>=0.40",
]

[project.scripts]
tubeless = "tubeless.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tubeless"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
