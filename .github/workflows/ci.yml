name: ci

# Lint, test, and build on every push to main and every pull request, so a
# release is only ever cut from a revision that has already gone green here.
# This never publishes -- publish.yml does that, and only on a release.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/ tests/
      - name: Tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel, then check the metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
