name: publish

# Publish to PyPI when a GitHub Release is published. Authentication is via
# PyPI Trusted Publishing (OIDC): no API token or password is stored anywhere --
# GitHub mints a short-lived identity token that PyPI verifies against the
# publisher you registered (owner seokhoonj / repo tubeless / this workflow /
# environment "pypi").

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC; this is what replaces a stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
